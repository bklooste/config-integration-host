# Quick start:  docker compose up
# Runs the service plus the external dependency it needs. Redis is a *network* dependency of the
# service, not something it ships — point Host__RedisConnectionString at your own Redis in production.
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Stand-in partner endpoint: logs every request it receives.
  receiver:
    image: mendhak/http-https-echo:37

  service:
    image: ghcr.io/bklooste/config-integration-host/service:latest
    # build: .          # uncomment to build from source instead of pulling
    ports:
      - "8080:8080"
    environment:
      Host__RedisConnectionString: redis:6379
      Pipes__0__Name: demo
      Pipes__0__Source__Transport: redis
      Pipes__0__Source__Stream: events
      Pipes__0__Source__ConsumerGroup: int-demo
      Pipes__0__Destination__Transport: http
      Pipes__0__Destination__Url: http://receiver:8080/hook
      Pipes__0__Destination__Method: POST
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
    depends_on:
      redis:
        condition: service_healthy
      receiver:
        condition: service_started
